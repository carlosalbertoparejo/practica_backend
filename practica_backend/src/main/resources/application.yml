spring:
  main:
    allow-circular-references: true
  application:
    name: usuarios
  datasource:
    url: jdbc:mysql://localhost:3306/fullstackhibernate
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
springdoc:
  swagger-ui:
    path: /misproductos.html
    operationsSorter: method
